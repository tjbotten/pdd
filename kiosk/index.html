<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PGS Displays</title>
  <link rel="stylesheet" href="css/display.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div id="screen-root" class="screen-root"></div>
    <div id="offline-indicator" class="offline-indicator" hidden>
      <span class="offline-dot" aria-hidden="true"></span>
      <span>Offline — showing last known counts</span>
    </div>
  </div>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
