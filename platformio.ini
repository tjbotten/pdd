; Listen-only zone-buffer serial sniffer.
; One image for both boards (BDD / generic ESP32-C3 Super Mini, 4 MB, native USB).
; Role (TX or RX) is chosen later in the web UI and stored in NVS.

[env:esp32-c3-supermini]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Opening the USB serial port should not force the ROM download pin dance.
monitor_rts = 0
monitor_dtr = 0
build_unflags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
